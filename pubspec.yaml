name: qnote_flutter
description: "QNote - A personal knowledge management app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_quill: ^11.0.0
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  wechat_assets_picker: ^10.1.2
  file_picker: ^8.1.3
  flutter_markdown: ^0.7.6+2
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  vibration: ^2.0.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.1
  http: ^1.2.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
