<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="qnote_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QNote</title>
  <link rel="manifest" href="manifest.json">

  <!--
    启动底色预置：Flutter 引擎加载完成前 body 默认是纯白，深色背景用户会先看到一屏白。
    这里同步读取 shared_preferences 写下的画布色（localStorage 键带 `flutter.` 前缀、
    值经 JSON 编码），在首帧前把 body 铺成 App 的真实底色，与原生端启动窗口策略一致。
    脚本必须内联且放在 head 里：任何外部资源都会让白底多停留一帧。
  -->
  <script>
    (function () {
      var FALLBACK_LIGHT = '#F9F9FF';
      var FALLBACK_DARK = '#111318';
      function readPref(key) {
        try {
          var raw = window.localStorage.getItem('flutter.' + key);
          return raw === null ? null : JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }
      try {
        var nightMode = readPref('launch_night_mode');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = nightMode === 1 || (nightMode !== 0 && prefersDark);
        var stored = readPref(isDark ? 'launch_canvas_dark' : 'launch_canvas_light');
        var color = stored || (isDark ? FALLBACK_DARK : FALLBACK_LIGHT);
        document.documentElement.style.backgroundColor = color;
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.backgroundColor = color;
        });
      } catch (e) {
        // 取不到偏好时保持浏览器默认底色，不影响正常加载
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
